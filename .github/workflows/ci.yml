name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Verify workflow commit belongs to master
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master

      - name: Setup release policy runtime
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm release:verify-tag "$GITHUB_REF_NAME"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: source-policy
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Formatting, lint, and source types
        if: matrix.node-version == '22'
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: End-to-end tests
        run: node --experimental-strip-types --test tests/e2e/*.test.ts

      - name: Leak tests
        run: pnpm test:leak

      - name: Packed consumer type resolution
        if: matrix.node-version == '22'
        run: pnpm test:types

      - name: Package metadata and contents
        if: matrix.node-version == '22'
        run: pnpm test:package

  regression-gate:
    runs-on:
      group: swm-ci
      labels: bench
    timeout-minutes: 30
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regression profile
        run: pnpm profile:ci

      - name: Balanced pino comparison
        run: pnpm profile:compare

      - name: Extension and wildcard regression profile
        run: pnpm profile:extensions

      - name: Upload profiles
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-profiles
          path: benchmark/profiles/

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: regression-gate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Build immutable release artifact
        run: pnpm release:artifact

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-artifact/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-artifact/

      - name: Verify release artifact checksum
        working-directory: release-artifact
        run: sha256sum --check SHA256SUMS

      - name: Publish
        run: node release-artifact/publish-release-artifact.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
